[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "zeus-trading-bot"
version = "0.1.0"
description = "Modular, production-grade automated trading bot"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.3",
    "pandas>=2.0",
    "numpy>=1.26",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "requests>=2.31",
]

[project.scripts]
zeus = "zeus.main:main"
zeus-backtest-mt5 = "zeus.backtest.run_mt5:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
]
mt5 = [
    "MetaTrader5>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["zeus*"]
